# Shared standards; upstream action SHAs verified 2026-10-18.
name: Update dependencies
'on':
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  dependencies:
    permissions:
      contents: write
      pull-requests: write
    uses: eigger/hass-repo-standards/.github/workflows/dependency-update.yml@c3f2e254c0867f1825ca8f636c347582e06707db # reviewed standards commit
    with:
      domain: ble_led_sign
      packages: '["imagespec", "blesession"]'
      python-version: '3.14'
      ha-components: bluetooth recorder image light number select switch button text
      test-profile: ha
      validation-command: python -m ruff check . && python -m ruff format --check . && python -m pytest tests/components/ble_led_sign/ -v
