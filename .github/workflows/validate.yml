# Shared standards; upstream action SHAs verified 2026-10-18.
name: Validate
'on':
  push:
    branches:
      - main
      - master
  pull_request: null
  workflow_dispatch: null
  schedule:
    - cron: "23 3 * * 1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: eigger/hass-repo-standards/.github/workflows/validate-integration.yml@c3f2e254c0867f1825ca8f636c347582e06707db # reviewed standards commit
