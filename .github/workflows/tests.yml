name: Tests
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@c3f2e254c0867f1825ca8f636c347582e06707db # reviewed standards commit
    with:
      domain: ble_led_sign
      python-versions: '["3.14"]'
      lint-python-version: '3.14'
      requirements: requirements_test.txt
      expected-ha-version: '2026.10.2'
      test-profile: ha
      ha-components: 'bluetooth recorder image light number select switch button text'
      dependency-modes: '["current", "minimum"]'
      minimum-packages: '["imagespec"]'
  minimum-ha:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@c3f2e254c0867f1825ca8f636c347582e06707db # reviewed standards commit
    with:
      domain: ble_led_sign
      python-versions: '["3.13"]'
      lint-python-version: '3.14'
      requirements: requirements_test_min.txt
      expected-ha-version: '2025.1.0'
      test-profile: ha
      ha-components: 'bluetooth recorder image light number select switch button text'
      dependency-modes: '["current", "minimum"]'
      minimum-packages: '["imagespec"]'
